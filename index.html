<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width">
        <title>MeowMusic</title>
        <link rel="stylesheet" href="style/index.css">
        <link rel="stylesheet" href="style/view.css">
        <link rel="stylesheet" href="style/ui.css">
        <link rel="stylesheet" href="style/config.css">
        <link rel="stylesheet" href="style/modal.css">
        <script type="module" src="script/index.js"></script>
    </head>
    <body>
        <!-- Full screen primary content container -->
        <main id="main" class="absolute view-config">
            <!-- Possible view classes:
                view-visualizer  view-library
                view-dual        view-config
            -->

            <section id="visualizer" class="absolute primary-content">
                Visualizer
            </section>

            <section id="library" class="absolute primary-content padded">
                Music Library
                <ol id="debug-library"></ol>
            </section>

            <section id="config" class="absolute padded">
                <!-- TODO: look into the "details" HTML element for collapsible settings -->
                Configuration
            </section>

            <!-- Primary user interface -->
            <nav id="controls" class="absolute">

            </nav>

        </main>

        <!-- Can contain the following constructs so far...
            p.modal-message
            p.modal-string-input
                input#modal-string-input
                button#modal-string-submit
            p.modal-number-input
                input#modal-string-input
                button#modal-string-submit
            p.modal-controls
                button
                button#modal-cancel
          -->
        <dialog id="modal" closedby="any"></dialog>

    </body>
</html>
